name: ci

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_PORTFOLIO_GRAPHQL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_PORTFOLIO_GRAPHQL_ENDPOINT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node env
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Screenshot baselines are generated on macOS, so CI runs the functional
      # checks only; visual diffs are part of the local verification gate.
      - name: E2E tests (builds and starts the app)
        run: npx playwright test --ignore-snapshots

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
